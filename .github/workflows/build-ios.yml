name: Build iOS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 3.50.0

    - name: Dependencies
      run: flutter pub get

    - name: Build iOS Release
      run: flutter build ios --release --no-codesign --no-tree-shake-icons
